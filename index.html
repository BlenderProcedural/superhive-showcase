<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More from Blender Procedural</title>
<meta name="description" content="Bestselling procedural generators, physics and VFX add-ons for Blender by Blender Procedural on Superhive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://assets.superhivemarket.com">
<style>
  /* Everything is sized in rem and 1rem = viewport width / 47.5 (16px at 760px, capped at 20px), so the widget
     keeps one aspect ratio (760:560) and an iframe with that fixed aspect-ratio always fits it. */
  html { font-size: clamp(9px, calc(100vw / 47.5), 20px); }
  :root {
    --bg: #0c0e13; --panel: #151922; --panel-2: #1c2232; --line: rgba(255,255,255,.08); --ink: #f3f5f9;
    --muted: #9aa3b5; --accent: #ff8a3d; --accent-2: #ff4f7b; --accent-3: #8b5cff; --gold: #ffb23d;
    --grad: linear-gradient(110deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
  }
  :root.light {
    --bg: #ffffff; --panel: #f4f6fa; --panel-2: #e9edf5; --line: rgba(15,20,30,.09); --ink: #141821; --muted: #5e6677;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  /* rounding can leave the iframe a pixel short, so never show a scrollbar while the widget scales
     (narrow phones, where the font floor kicks in, may still scroll) */
  @media (min-width: 430px) { html, body { overflow: hidden; } }
  body { font: 500 1rem/1.4 Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sc { position: relative; overflow: hidden; background: var(--bg); border-radius: 1.25rem; padding: 1rem;
        border: 1px solid var(--line); isolation: isolate; height: 35rem; display: flex; flex-direction: column; gap: .7rem; }
  .sc::before, .sc::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; filter: blur(10px); }
  .sc::before { inset: -45% -12% auto auto; width: 32rem; height: 32rem;
                background: radial-gradient(closest-side, rgba(255,138,61,.2), transparent 70%);
                animation: drift 14s ease-in-out infinite alternate; }
  .sc::after { inset: auto auto -50% -15%; width: 30rem; height: 30rem;
               background: radial-gradient(closest-side, rgba(139,92,255,.2), transparent 70%);
               animation: drift 18s ease-in-out infinite alternate-reverse; }
  :root.light .sc::before, :root.light .sc::after { opacity: .5; }
  @keyframes drift { to { transform: translate(-3rem, 2.5rem) scale(1.1); } }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: 2.6rem; flex: none; }
  .brand { display: flex; align-items: center; gap: .65rem; min-width: 0; }
  .av { width: 2.5rem; height: 2.5rem; border-radius: 50%; object-fit: cover; flex: none;
        box-shadow: 0 0 0 .14rem var(--bg), 0 0 0 .26rem var(--accent-2); background: var(--panel); }
  .brand b { display: block; font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; }
  .brand span { display: block; font-size: .7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eyebrow { font-size: .6rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
             background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; flex: none; padding: .5rem .95rem; border-radius: 999px;
         font-size: .76rem; font-weight: 700; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
         transition: border-color .25s, transform .2s, background .25s; }
  .btn:hover { border-color: rgba(255,138,61,.6); transform: translateY(-1px); background: var(--panel-2); }
  .btn svg { width: .8rem; height: .8rem; }

  /* hero: the bundle, big */
  /* 2px gradient frame around a 31rem x 15.5rem (exactly 2:1) image, so the bundle art is never cropped */
  .hero { position: relative; flex: none; height: calc(15.5rem + 4px); border-radius: 1rem; padding: 2px;
          background: linear-gradient(110deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
          background-size: 300% 100%; animation: flow 8s linear infinite;
          box-shadow: 0 .8rem 2.4rem rgba(255,79,123,.25); }
  @keyframes flow { to { background-position: 300% 0; } }
  .hero-in { position: relative; display: grid; grid-template-columns: 31rem minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%;
             border-radius: calc(1rem - 2px); overflow: hidden; background: var(--bg); }
  .hero-img { position: relative; overflow: hidden; display: block; background: var(--panel); }
  .hero-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .3s; }
  .hero-img:hover img { filter: brightness(1.08); }
  .hero-img::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; pointer-events: none;
                     background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
                     transform: translateX(-130%) skewX(-18deg); animation: shine 6.5s ease-in-out 1.2s infinite; }
  @keyframes shine { 0% { transform: translateX(-130%) skewX(-18deg); } 28%, 100% { transform: translateX(330%) skewX(-18deg); } }
  .ribbon { position: absolute; left: .7rem; top: .7rem; z-index: 1; display: inline-flex; align-items: center; gap: .3rem;
            padding: .28rem .6rem; border-radius: 999px; font-size: .62rem; font-weight: 900; letter-spacing: .08em;
            text-transform: uppercase; color: #fff; background: var(--grad); box-shadow: 0 .3rem 1rem rgba(255,79,123,.45); }
  .info { position: relative; display: flex; flex-direction: column; gap: .45rem; padding: .95rem 1.05rem; overflow: hidden;
          background: radial-gradient(120% 90% at 100% 0%, rgba(255,138,61,.16), transparent 60%),
                      radial-gradient(120% 90% at 0% 100%, rgba(139,92,255,.14), transparent 60%), var(--panel); }
  .info h2 { margin: 0; font-size: 1.22rem; line-height: 1.12; font-weight: 900; letter-spacing: -.025em; }
  .info h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kicker { font-size: .72rem; color: var(--muted); line-height: 1.3; margin-top: -.15rem; }
  .stats { display: flex; gap: .3rem; flex-wrap: nowrap; }
  .stat { display: inline-flex; align-items: center; gap: .25rem; font-size: .64rem; font-weight: 700; padding: .2rem .45rem;
          border-radius: .4rem; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
  .stat .star { color: var(--gold); }
  .pricing { display: flex; align-items: baseline; gap: .45rem; margin-top: auto; flex-wrap: wrap; }
  .pricing .now { font-size: 1.55rem; font-weight: 900; letter-spacing: -.03em; }
  .pricing .was { font-size: .82rem; color: var(--muted); text-decoration: line-through; font-weight: 600; }
  .pricing .off { font-size: .62rem; font-weight: 900; color: #fff; background: #ff4f5e; padding: .15rem .4rem; border-radius: .35rem;
                  align-self: center; }
  .save { font-size: .64rem; color: #39d98a; font-weight: 700; margin-top: -.35rem; }
  .buy { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: .4rem;
         padding: .62rem .8rem; border-radius: .7rem; font-size: .8rem; font-weight: 800; color: #fff; background: var(--grad);
         background-size: 160% 100%; box-shadow: 0 .4rem 1.3rem rgba(255,79,123,.4); transition: background-position .4s, transform .2s; }
  .buy:hover { background-position: 100% 0; transform: translateY(-1px); }
  .buy::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%;
                background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
                transform: translateX(-150%) skewX(-18deg); animation: shine 4.5s ease-in-out 2s infinite; }
  .buy svg { width: .85rem; height: .85rem; }

  /* bestsellers */
  .head { display: flex; align-items: center; justify-content: space-between; height: 1.4rem; flex: none; }
  .head h3 { margin: 0; display: flex; align-items: baseline; gap: .5rem; font-size: .9rem; font-weight: 800; letter-spacing: -.01em; }
  .head h3 small { font-size: .68rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .arrows { display: flex; gap: .35rem; }
  .arrows button { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
                   color: var(--ink); cursor: pointer; display: grid; place-items: center; transition: border-color .2s, background .2s; }
  .arrows button:hover { border-color: rgba(255,138,61,.6); background: var(--panel-2); }
  .arrows svg { width: .75rem; height: .75rem; }
  .rail { position: relative; flex: 1; min-height: 0; }
  .track { display: flex; gap: .7rem; overflow-x: auto; scrollbar-width: none; height: 100%; padding: .25rem .1rem .1rem;
           mask: linear-gradient(90deg, transparent, #000 2.5%, #000 97.5%, transparent); }
  .track::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 13.2rem; align-self: flex-start; border-radius: .8rem; background: var(--panel);
          border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column;
          transition: transform .25s, border-color .25s, box-shadow .25s; }
  .card:hover { transform: translateY(-.2rem); border-color: rgba(255,138,61,.55); box-shadow: 0 .6rem 1.4rem rgba(0,0,0,.35); }
  .thumb { position: relative; width: 100%; aspect-ratio: 2 / 1; background: var(--panel-2); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
  .card:hover .thumb img { transform: scale(1.06); }
  .tags { position: absolute; left: .4rem; top: .4rem; display: flex; gap: .25rem; }
  .tag { font-size: .56rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: .2rem .42rem;
         border-radius: .35rem; color: #fff; background: rgba(10,12,18,.7); backdrop-filter: blur(6px); white-space: nowrap; }
  .tag.hot { background: var(--grad); }
  .tag.sale { background: #ff4f5e; }
  .tag.new { background: #2f80ff; }
  .body { padding: .45rem .6rem .5rem; display: flex; flex-direction: column; gap: .25rem; }
  .body b { font-size: .74rem; line-height: 1.22; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden; min-height: 1.8rem; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: .4rem; font-size: .66rem; color: var(--muted); }
  .meta .stars { color: var(--gold); font-weight: 700; }
  .price { font-weight: 800; color: var(--ink); }
  .old { text-decoration: line-through; opacity: .6; font-weight: 600; margin-right: .25rem; }
  .empty { margin: auto; color: var(--muted); font-size: .8rem; }
  .foot { position: absolute; right: 1rem; bottom: .25rem; font-size: .52rem; color: var(--muted); opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="sc" id="sc">
  <header class="top">
    <a class="brand" id="brand" target="_top" rel="noopener">
      <img class="av" id="avatar" alt="">
      <div><div class="eyebrow">More from the creator</div><b id="cname">Blender Procedural</b><span id="tagline"></span></div>
    </a>
    <a class="btn" id="store" target="_top" rel="noopener">Visit the store
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>
  </header>
  <section class="hero" id="hero"></section>
  <div class="head">
    <h3><span>🔥 Bestsellers</span><small id="sub">Latest hits &amp; all-time favourites</small></h3>
    <div class="arrows">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
  <div class="rail" id="rail"><div class="track" id="track"></div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(async function () {
  const qs = new URLSearchParams(location.search);
  if (qs.get('theme') === 'light') document.documentElement.classList.add('light');
  const exclude = new Set((qs.get('exclude') || '').split(',').map(s => s.trim()).filter(Boolean));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const NICE = {'Addons': 'Add-on', 'Modifier Setups': 'Geometry Nodes', 'Render Setups': 'Render setup', 'Models': 'Models'};
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  let data;
  try { data = await (await fetch('data/products.json', {cache: 'no-cache'})).json(); }
  catch (e) { $('track').innerHTML = '<div class="empty">Could not load products.</div>'; return; }

  const by = Object.fromEntries(data.products.map(p => [p.slug, p]));
  const storeUrl = data.creator.url;
  $('brand').href = storeUrl; $('store').href = storeUrl;
  $('cname').textContent = data.creator.name;
  $('avatar').src = data.creator.avatar;
  $('tagline').textContent = `${data.count} tools for Blender · ${data.creator.tagline || ''}`.replace(/ · $/, '');

  const num = s => { const m = /\$([\d,.]+)/.exec(s || ''); return m ? parseFloat(m[1].replace(/,/g, '')) : NaN; };
  const salesN = p => parseInt(String(p.sales || '').replace(/\D/g, '') || '0', 10);
  const cat = p => esc(NICE[p.category] || p.category);
  const goodRating = p => p.rating >= 4 && p.reviews >= 3;   // only show stars that help

  // hero: the first configured bundle that is not the page we are on
  let hero = (data.hero || []).map(h => by[h.slug] && {...by[h.slug], ...h}).find(h => h && !exclude.has(h.slug));
  const picks = (data.picks || []).map(s => by[s]).filter(p => p && !exclude.has(p.slug) && (!hero || p.slug !== hero.slug));
  if (!hero && picks.length) hero = {...picks.shift(), eyebrow: 'Bestseller'};

  if (hero) {
    const was = num(hero.price_old), now = num(hero.price);
    const save = was > now && !/-/.test(hero.price) ? `You save $${(was - now).toFixed(2)}` : '';
    const title = esc(hero.headline || hero.title).replace(/\*(.+?)\*/g, '<em>$1</em>');
    const stats = [];
    if (goodRating(hero)) stats.push(`<span class="stat" title="${hero.reviews} reviews"><span class="star">★</span>${hero.rating.toFixed(1)} (${hero.reviews})</span>`);
    if (hero.sales) stats.push(`<span class="stat">🔥 ${esc(hero.sales)} sales</span>`);
    $('hero').innerHTML = `
      <div class="hero-in">
        <a class="hero-img" href="${esc(hero.url)}" target="_top" rel="noopener">
          <img src="${esc(hero.image_hd || hero.image)}" alt="${esc(hero.title)}" fetchpriority="high">
          <span class="ribbon">${esc(hero.eyebrow || 'Best value')}</span>
        </a>
        <div class="info">
          <h2>${title}</h2>
          ${hero.kicker ? `<div class="kicker">${esc(hero.kicker)}</div>` : ''}
          ${stats.length ? `<div class="stats">${stats.join('')}</div>` : ''}
          <div class="pricing">
            <span class="now">${hero.free ? 'Free' : esc(hero.price)}</span>
            ${hero.price_old ? `<span class="was">${esc(hero.price_old)}</span>` : ''}
            ${hero.sale ? `<span class="off">${esc(hero.sale.replace(/\s+/g, ''))}</span>` : ''}
          </div>
          ${save ? `<div class="save">${save}</div>` : ''}
          <a class="buy" href="${esc(hero.url)}" target="_top" rel="noopener">${esc(hero.cta || 'Get the bundle')} ${ARROW}</a>
        </div>
      </div>`;
  } else $('hero').remove();

  // bestseller rail
  const track = $('track');
  const card = (p, i) => {
    const tags = [];
    if (p.new) tags.push('<span class="tag new">New</span>');
    if (salesN(p) >= 100) tags.push(`<span class="tag hot">${esc(p.sales)} sales</span>`);
    if (p.sale && !p.free) tags.push(`<span class="tag sale">${esc(p.sale.replace(/\s+/g, ''))}</span>`);
    const left = goodRating(p) ? `<span class="stars">★ ${p.rating.toFixed(1)}</span>` : `<span>${cat(p)}</span>`;
    return `
    <a class="card" href="${esc(p.url)}" target="_top" rel="noopener" title="${esc(p.title)}">
      <div class="thumb"><img src="${esc(p.image)}" alt="" loading="${i < 4 ? 'eager' : 'lazy'}"><div class="tags">${tags.slice(0, 2).join('')}</div></div>
      <div class="body"><b>${esc(p.title)}</b>
        <div class="meta">${left}<span>${p.price_old ? `<span class="old">${esc(p.price_old)}</span>` : ''}<span class="price">${p.free ? 'Free' : esc(p.price)}</span></span></div></div>
    </a>`;
  };
  if (!picks.length) track.innerHTML = '<div class="empty">Visit the store to see every product.</div>';
  const html = picks.map(card).join('');
  track.innerHTML = html;
  const loop = picks.length > 3 && track.scrollWidth > track.clientWidth * 1.3;
  if (loop) track.insertAdjacentHTML('beforeend', html);   // second copy for a seamless loop

  // gentle auto-scroll that yields to the visitor
  let hold = 0, last = performance.now(), acc = 0;
  const pause = ms => hold = performance.now() + ms;
  ['mouseenter', 'touchstart', 'focusin', 'wheel'].forEach(ev => $('rail').addEventListener(ev, () => pause(1e9), {passive: true}));
  ['mouseleave', 'touchend', 'focusout'].forEach(ev => $('rail').addEventListener(ev, () => pause(2500), {passive: true}));
  function tick(now) {
    const dt = Math.min(now - last, 60); last = now;
    if (!reduce && loop && now > hold && !document.hidden) {
      acc += dt * 0.028 * (innerWidth / 760);
      if (acc >= 1) { const step = Math.floor(acc); acc -= step; track.scrollLeft += step;
        const half = track.scrollWidth / 2; if (track.scrollLeft >= half) track.scrollLeft -= half; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const jump = dir => {
    pause(4000);
    if (loop && dir < 0 && track.scrollLeft < track.clientWidth) track.scrollLeft += track.scrollWidth / 2;
    track.scrollBy({left: dir * track.clientWidth * 0.75, behavior: 'smooth'});
  };
  $('prev').addEventListener('click', () => jump(-1));
  $('next').addEventListener('click', () => jump(1));

  $('foot').textContent = `Updated ${new Date(data.updated).toISOString().slice(0, 10)}`;
})();
</script>
</body>
</html>
